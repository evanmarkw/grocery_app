<div class="min-h-screen">
  <p-toolbar>
    <ng-template pTemplate="start">
      <div class="flex align-items-center gap-2">
        <p-button
          icon="pi pi-arrow-left"
          (onClick)="goBack()"
          [text]="true"
        ></p-button>
        <span class="text-xl font-bold">Shelf Management</span>
      </div>
    </ng-template>
    <ng-template pTemplate="end">
      <p-button
        label="Add Shelf"
        icon="pi pi-plus"
        (onClick)="showAddDialog()"
      ></p-button>
    </ng-template>
  </p-toolbar>

  <div class="p-4">
    <p-table
      [value]="shelves"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} shelves"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Code</th>
          <th>Store</th>
          <th>Aisle</th>
          <th>Level</th>
          <th>Section</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-shelf>
        <tr>
          <td>{{ shelf.code }}</td>
          <td>{{ getStoreName(shelf.storeId) }}</td>
          <td>{{ getAisleName(shelf.aisleId) }}</td>
          <td>{{ shelf.level }}</td>
          <td>{{ shelf.section }}</td>
          <td>
            <div class="flex gap-2">
              <p-button
                label="Edit"
                icon="pi pi-pencil"
                (onClick)="showEditDialog(shelf)"
                severity="info"
                size="small"
              ></p-button>
              <p-button
                label="Delete"
                icon="pi pi-trash"
                (onClick)="deleteShelf(shelf)"
                severity="danger"
                size="small"
              ></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center">No shelves found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [(visible)]="displayDialog"
  [header]="isEditMode ? 'Edit Shelf' : 'Add Shelf'"
  [modal]="true"
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <form class="flex flex-column gap-3">
    <div class="field">
      <label for="storeId">Store *</label>
      <p-dropdown
        id="storeId"
        [(ngModel)]="shelfForm.storeId"
        [options]="stores"
        name="storeId"
        placeholder="Select Store"
        styleClass="w-full"
        (onChange)="onStoreChange($event.value)"
        [disabled]="isEditMode"
      ></p-dropdown>
    </div>

    <div class="field">
      <label for="aisleId">Aisle *</label>
      <p-dropdown
        id="aisleId"
        [(ngModel)]="shelfForm.aisleId"
        [options]="aisles"
        name="aisleId"
        placeholder="Select Aisle"
        styleClass="w-full"
        [disabled]="isEditMode"
      ></p-dropdown>
    </div>

    <div class="field">
      <label for="code">Shelf Code *</label>
      <input
        id="code"
        type="text"
        pInputText
        [(ngModel)]="shelfForm.code"
        name="code"
        class="w-full"
        required
        placeholder="e.g., A1-L2-S3"
      />
    </div>

    <div class="grid">
      <div class="col-6">
        <div class="field">
          <label for="level">Level *</label>
          <p-inputNumber
            id="level"
            [(ngModel)]="shelfForm.level"
            name="level"
            [min]="1"
            [max]="10"
            class="w-full"
            required
          ></p-inputNumber>
        </div>
      </div>
      <div class="col-6">
        <div class="field">
          <label for="section">Section *</label>
          <p-inputNumber
            id="section"
            [(ngModel)]="shelfForm.section"
            name="section"
            [min]="1"
            [max]="20"
            class="w-full"
            required
          ></p-inputNumber>
        </div>
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancel"
      icon="pi pi-times"
      (onClick)="hideDialog()"
      severity="secondary"
    ></p-button>
    <p-button
      label="Save"
      icon="pi pi-check"
      (onClick)="saveShelf()"
    ></p-button>
  </ng-template>
</p-dialog>
